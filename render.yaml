# Render.com Blueprint — DTN India Backend API
# Digital Telco Network India Pvt. Ltd. (DTN India)

services:
  - type: web
    name: dtn-customer-application-portal
    runtime: node
    region: singapore  # Closest to Indian users
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "24h"
      - key: PAYMENT_MODE
        value: simulated
      - key: CLIENT_URL
        value: https://dtn-india-apply.netlify.app
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false  # Configure your secret administrator password in Render Dashboard > Environment Variables
      - key: DB_FILE
        value: ./data/dtn_application_portal.db
      - key: UPLOAD_DIR
        value: ./uploads

